<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mi cuota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Afiche de pelea + carnet de socio. Ver DESIGN.md.
    El color de fondo del afiche ES el estado: lona (al día), campana (vence), rincón rojo (atrasado).
  */
  :root {
    --lona: #1a5987;      /* azul de la lona del ring */
    --lona-hondo: #123f61;
    --rincon: #b8261f;    /* rincón rojo */
    --campana: #e8a317;   /* bronce de la campana */
    --cuerda: #f4f4f1;    /* cuerda blanca */
    --tinta: #111418;
    --tinta-2: #4a525c;
    --tinta-3: #6e7681;
    --suelo: #e4e7ea;     /* piso de goma del gimnasio */
    --papel: #ffffff;
    --raya: #cfd4da;
    --wa: #0f8a45;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --texto: "Barlow", ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --lona: #2a73a8; --lona-hondo: #1b5680; --rincon: #c9352d; --campana: #e8a317;
      --tinta: #e9edf1; --tinta-2: #b1b9c2; --tinta-3: #8d96a0;
      --suelo: #0c1720; --papel: #14222e; --raya: #24384a; --wa: #3fcf7f;
    }
  }
  :root[data-theme="dark"] {
    --lona: #2a73a8; --lona-hondo: #1b5680; --rincon: #c9352d; --campana: #e8a317;
    --tinta: #e9edf1; --tinta-2: #b1b9c2; --tinta-3: #8d96a0;
    --suelo: #0c1720; --papel: #14222e; --raya: #24384a; --wa: #3fcf7f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--suelo); color: var(--tinta);
    font-family: var(--texto); font-size: 16.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 460px; margin: 0 auto; padding-bottom: calc(36px + env(safe-area-inset-bottom)); }
  :focus-visible { outline: 3px solid var(--campana); outline-offset: 2px; }

  /* ---------- afiche ---------- */
  .afiche {
    position: relative; color: #fff; padding: 0 20px 46px; background: var(--lona); overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), 0 100%);
  }
  /* Trama de puntos de afiche impreso, solo en la esquina. */
  .afiche::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(rgba(0,0,0,.22) 1.3px, transparent 1.7px) 0 0 / 7px 7px;
    -webkit-mask-image: linear-gradient(200deg, #000 0%, transparent 45%);
            mask-image: linear-gradient(200deg, #000 0%, transparent 45%);
  }
  .afiche > * { position: relative; z-index: 1; }
  .afiche .cuerdas { position: relative; }
  .afiche.vence { background: var(--campana); color: #1a1407; }
  .afiche.atrasado { background: var(--rincon); }
  .cuerdas { display: grid; gap: 7px; margin: 0 -20px; padding-top: 18px; }
  .cuerdas i { display: block; height: 6px; border-radius: 0 3px 3px 0; margin-right: 22px; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .cuerdas i:nth-child(1) { background: var(--rincon); }
  .cuerdas i:nth-child(2) { background: var(--cuerda); }
  .cuerdas i:nth-child(3) { background: var(--lona-hondo); }
  .afiche.atrasado .cuerdas i:nth-child(1) { background: #7d1712; }
  .afiche.vence .cuerdas i:nth-child(3) { background: var(--lona); }

  .gym { margin: 16px 0 0; font-family: var(--display); font-weight: 600; font-size: 17px; opacity: .85; }
  .nombre {
    margin: 2px 0 0; font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(46px, 15vw, 64px); line-height: .9; letter-spacing: -.01em; overflow-wrap: anywhere;
  }
  .conteo { display: flex; align-items: flex-end; gap: 12px; margin-top: 22px; }
  .conteo .num {
    font-family: var(--display); font-weight: 900; font-size: 112px; line-height: .78;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  .conteo .num.check { font-size: 92px; }
  .conteo .que { padding-bottom: 4px; font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1; text-transform: uppercase; }
  .conteo .que small { display: block; margin-top: 6px; font-family: var(--texto); font-weight: 500; font-size: 15px; text-transform: none; opacity: .9; line-height: 1.3; }

  /* Reloj del mes: una raya por día, como el reloj del round. */
  .reloj { margin-top: 22px; }
  .rayas { display: flex; gap: 2px; height: 22px; align-items: stretch; }
  .rayas i { flex: 1; border-radius: 1px; background: rgba(255,255,255,.22); transform-origin: bottom; }
  .rayas i.on { background: #fff; }
  .rayas i.hoy { background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35); transform: scaleY(1.35); }
  .afiche.vence .rayas i { background: rgba(26,20,7,.18); }
  .afiche.vence .rayas i.on, .afiche.vence .rayas i.hoy { background: #1a1407; }
  .afiche.atrasado .rayas i.on { background: #1a0605; }
  .afiche.atrasado .rayas { gap: 4px; }
  .afiche.atrasado .rayas i { flex: 0 0 9px; }
  .afiche.atrasado .reloj .marcas { justify-content: flex-start; gap: 6px; }
  .afiche.atrasado .reloj .marcas span + span::before { content: "→ "; }
  .reloj .marcas { display: flex; justify-content: space-between; margin-top: 7px; font-family: var(--display); font-weight: 600; font-size: 15px; opacity: .85; }

  @keyframes entra { from { opacity: 0; transform: translateY(14px); } }
  @keyframes crece { from { transform: scaleY(0); } }
  @keyframes sello { 0% { opacity: 0; transform: rotate(-14deg) scale(1.9); } 70% { opacity: .9; transform: rotate(-14deg) scale(.94); } }
  .nombre { animation: entra .45s cubic-bezier(.2,.7,.2,1) both; }
  .conteo { animation: entra .45s .08s cubic-bezier(.2,.7,.2,1) both; }
  .rayas i { animation: crece .35s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 12ms + .15s); }
  main > section { animation: entra .45s cubic-bezier(.2,.7,.2,1) both; }
  main > section:nth-of-type(2) { animation-delay: .1s; }
  main > section:nth-of-type(3) { animation-delay: .18s; }

  /* ---------- pagar ---------- */
  .pagar { padding: 22px 20px 6px; display: flex; flex-direction: column; gap: 12px; }
  .debe { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--tinta); padding-bottom: 8px; }
  .debe .k { font-weight: 600; color: var(--tinta-2); }
  .debe .v { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .debe .v small { font-size: 18px; font-weight: 600; color: var(--tinta-3); margin-left: 4px; }

  /* Botón que se hunde al golpearlo, como un pad. */
  .golpe {
    --base: var(--lona); --sombra: var(--lona-hondo); --letra: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 60px; padding: 0 18px; width: 100%;
    background: var(--base); color: var(--letra); border: 0; border-radius: 6px;
    box-shadow: 0 5px 0 var(--sombra); margin-bottom: 5px;
    font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em;
    text-decoration: none; cursor: pointer; transition: transform .06s, box-shadow .06s;
  }
  .golpe:active { transform: translateY(5px); box-shadow: 0 0 0 var(--sombra); }
  .golpe .monto { font-variant-numeric: tabular-nums; padding-left: 14px; border-left: 2px solid rgba(255,255,255,.35); }
  .golpe.claro { --base: var(--papel); --sombra: var(--raya); --letra: var(--tinta); border: 2px solid var(--raya); }
  .golpe.claro .monto { border-left-color: var(--raya); }
  .golpe .flecha { font-size: 26px; line-height: 1; transition: transform .15s; }
  .golpe[aria-expanded="true"] .flecha { transform: rotate(90deg); }

  /* Ticket de transferencia con línea de corte. */
  .plegable { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .28s cubic-bezier(.2,.7,.2,1), visibility 0s .28s; }
  .plegable.abierto { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .28s cubic-bezier(.2,.7,.2,1); }
  .plegable > .ticket { min-height: 0; overflow: hidden; }
  .ticket { position: relative; background: var(--papel); border-radius: 6px; margin-top: 4px; }
  .ticket .fila.monto { background: color-mix(in srgb, var(--campana) 16%, var(--papel)); }
  .ticket .fila.monto .v { font-family: var(--display); font-weight: 800; font-size: 24px; }
  .ticket .k .ok { display: none; color: var(--wa); font-weight: 700; margin-left: 6px; }
  .ticket .fila.copiado .k .ok { display: inline; }
  .ticket .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 16px; }
  .ticket .fila + .fila { border-top: 1px dotted var(--raya); }
  .ticket .k { font-size: 13.5px; color: var(--tinta-3); }
  .ticket .v { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .ticket .copiar {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 5px; border: 2px solid var(--lona);
    background: transparent; color: var(--lona); font-family: var(--display); font-weight: 800; font-size: 16px;
    text-transform: uppercase; cursor: pointer;
  }
  .ticket .copiar.listo { background: var(--lona); color: #fff; }
  .corte { position: relative; height: 22px; }
  .corte::before { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 2px dashed var(--raya); }
  .corte::after, .corte span { content: ""; position: absolute; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--suelo); }
  .corte::after { right: -11px; } .corte span { left: -11px; }
  .ticket .abajo { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .ticket .abajo p { margin: 0; font-size: 14.5px; color: var(--tinta-2); }
  .linkwa { display: inline-flex; align-items: center; gap: 8px; color: var(--wa); font-weight: 700; text-decoration: none; font-size: 16.5px; min-height: 44px; }
  .linkwa:hover { text-decoration: underline; }
  .textlink { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--lona); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; text-align: left; }

  .salida { margin: 4px 0 0; font-size: 15.5px; color: var(--tinta-2); }
  .salida a { color: var(--rincon); font-weight: 700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .salida a { color: #ff8a80; } }
  :root[data-theme="dark"] .salida a { color: #ff8a80; }
  .efectivo { margin: 0; color: var(--tinta-2); }

  .tranquilo { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 18px 20px 4px; }
  .fecha-pelea {
    width: 78px; text-align: center; background: var(--papel); border-radius: 6px; overflow: hidden;
    border: 2px solid var(--tinta); font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: 1;
  }
  .fecha-pelea span { display: block; padding: 4px 0; background: var(--tinta); color: var(--suelo); font-size: 14px; }
  .fecha-pelea b { display: block; padding: 6px 0 2px; font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .fecha-pelea small { display: block; padding-bottom: 7px; font-size: 15px; color: var(--tinta-3); }
  .tranquilo .t { font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1.05; text-transform: uppercase; }
  .tranquilo p { margin: 4px 0 0; font-size: 15.5px; color: var(--tinta-2); }

  .carnet .cuerpo { position: relative; }
  .estampa {
    position: absolute; top: 12px; right: 12px; padding: 5px 9px 3px; border: 3px solid var(--wa); border-radius: 5px;
    color: var(--wa); font-family: var(--display); font-weight: 900; font-size: 19px; line-height: 1; text-transform: uppercase; text-align: center;
    transform: rotate(-14deg); opacity: .9; animation: sello .5s .45s cubic-bezier(.3,1.4,.5,1) both;
  }
  .estampa small { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }

  /* Barra de pago que queda a mano del pulgar cuando el botón sale de la pantalla. */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--papel);
    border-top: 2px solid var(--tinta); transform: translateY(110%); transition: transform .22s cubic-bezier(.2,.7,.2,1);
  }
  .barra.ver { transform: none; }
  .barra .cuanto { flex: none; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; }
  .barra .cuanto small { display: block; font-family: var(--texto); font-size: 12.5px; font-weight: 600; color: var(--tinta-3); }
  .barra .golpe { min-height: 52px; font-size: 20px; justify-content: center; }
  @media (min-width: 500px) { .barra { left: 50%; right: auto; width: 460px; margin-left: -230px; } }

  .demo { margin: 26px 20px 0; padding: 12px 14px; border: 2px dashed var(--raya); border-radius: 6px; }
  .demo p { margin: 0 0 8px; font-size: 14px; color: var(--tinta-3); }
  .demo div { display: flex; gap: 6px; }
  .demo button {
    flex: 1; min-height: 44px; border-radius: 5px; border: 2px solid var(--tinta); background: transparent; color: var(--tinta);
    font-family: var(--display); font-weight: 800; font-size: 16px; text-transform: uppercase; cursor: pointer;
  }
  .demo button[aria-pressed="true"] { background: var(--tinta); color: var(--suelo); }

  /* ---------- carnet ---------- */
  .carnet {
    margin: 26px 16px 0; background: var(--papel); border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 0 var(--raya), 0 10px 24px -14px rgba(10, 30, 50, .35);
    transform: rotate(-1.2deg);
  }
  .carnet .cinta { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; background: var(--tinta); color: var(--suelo); font-family: var(--display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
  .carnet .cinta span:last-child { color: var(--campana); }
  .carnet .cuerpo { padding: 14px 16px 16px; }
  .carnet .plan { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; }
  .carnet .precio { color: var(--tinta-3); font-size: 14.5px; margin-top: 2px; }
  .hoyos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 14px; }
  .hoyo { display: flex; flex-direction: column; align-items: center; gap: 5px; font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--tinta-3); }
  .hoyo i { display: block; width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--raya); }
  .hoyo.suyo { color: var(--tinta); }
  .hoyo.suyo i { border: 0; background: var(--suelo); box-shadow: inset 0 3px 5px rgba(0,0,0,.28); }
  .carnet .nota { margin: 12px 0 0; font-size: 14.5px; color: var(--tinta-2); }

  /* ---------- pagos ---------- */
  .pagos { margin: 30px 20px 0; }
  .pagos h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
  .pagos ol { list-style: none; margin: 0; padding: 0; }
  .pagos li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--raya); }
  .sello { font-family: var(--display); font-weight: 800; text-align: center; line-height: .95; color: var(--lona); text-transform: uppercase; }
  .sello b { display: block; font-size: 28px; }
  .sello span { font-size: 13px; }
  .pagos .c { font-size: 14.5px; color: var(--tinta-2); }
  .pagos .m { font-family: var(--display); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
  .vacio { margin: 0; color: var(--tinta-3); }

  .pie { margin: 28px 20px 0; font-size: 14px; color: var(--tinta-3); }
  .pie a { color: var(--lona); font-weight: 600; }

  .falla { padding: 60px 24px; }
  .falla h1 { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .95; text-transform: uppercase; margin: 0 0 12px; }
  .falla p { color: var(--tinta-2); margin: 0; }

  .cargando { height: 320px; background: var(--lona); animation: pulso 1.1s ease-in-out infinite; }
  @keyframes pulso { 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) {
    .cargando { animation: none; } .golpe, .golpe .flecha, .plegable, .barra { transition: none; } .carnet { transform: none; }
    .nombre, .conteo, .rayas i, main > section, .estampa { animation: none; }
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--tinta); color: var(--suelo); padding: 10px 18px; border-radius: 6px;
    font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main id="app"><div class="cargando" aria-label="Cargando"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/*
  Mi cuota: la página personal de cada alumno.

  Llega de dos formas:
   - /cuota?a=<id>&k=<firma>  → la pide al servidor (el worker valida la firma y
     devuelve SOLO los datos de esa persona).
   - /cuota#d=<datos>          → modo demostración: los datos vienen en el propio link,
     no toca ningún servidor. Sin nada, muestra un ejemplo.
*/

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES3 = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS_LARGO = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const SEMANA = [["lun","Lu","lunes"],["mar","Ma","martes"],["mie","Mi","miércoles"],["jue","Ju","jueves"],["vie","Vi","viernes"],["sab","Sá","sábado"]];
const PLANES = { p3: "3 veces por semana", p8: "8 días al mes" };

const HOY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function plata(n) { return "$" + Math.round(Number(n) || 0).toLocaleString("es-CL"); }
function fecha(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "")); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function diasHasta(s) { const f = fecha(s); return f ? Math.round((f - HOY) / 86400000) : null; }
function largo(s) { const f = fecha(s); return f ? DIAS_LARGO[f.getDay()] + " " + f.getDate() + " de " + MESES[f.getMonth()] : ""; }
function corto(s) { const f = fecha(s); return f ? f.getDate() + " de " + MESES[f.getMonth()] : ""; }
function plural(n, a, b) { return n + " " + (n === 1 ? a : b); }
function telNormal(t) { const d = String(t || "").replace(/\D/g, ""); return d.length === 9 ? "56" + d : d; }
function y(lista) { return lista.join(", ").replace(/, ([^,]*)$/, " y $1"); }

function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function copiar(texto, boton) {
  const listo = () => {
    if (boton) { const antes = boton.textContent; boton.textContent = "Listo"; boton.classList.add("listo");
      setTimeout(() => { boton.textContent = antes; boton.classList.remove("listo"); }, 1500); }
    else toast("Datos copiados");
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(listo, () => copiarViejo(texto) && listo());
  } else if (copiarViejo(texto)) listo();
}
function copiarViejo(texto) {
  const t = document.createElement("textarea");
  t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove(); return ok;
}

/* ---------- el estado, como conteo de round ---------- */

function leer(d) {
  const a = d.alumno;
  const k = diasHasta(a.ven);
  const monto = Number(a.m) || Number(a.mensual) || 0;
  if (k === null) return { cls: "vence", num: "?", que: "Falta tu fecha", sub: "Escríbele al profe para dejarla al día.", debe: monto, paga: true };
  if (k > 5) return { cls: "", num: k, que: k === 1 ? "Día de mes pagado" : "Días de mes pagado", sub: "Estás al día hasta el " + largo(a.ven) + ".", debe: 0, paga: false, proximo: monto };
  if (k === 1) return { cls: "vence", num: 1, que: "Mañana vence tu mes", sub: "Si no está pagado, mañana ya no puedes entrar al gimnasio.", debe: monto, paga: true };
  if (k > 0) return { cls: "vence", num: k, que: "Días para que venza tu mes", sub: "Vence el " + largo(a.ven) + ".", debe: monto, paga: true };
  if (k === 0) return { cls: "atrasado", num: "0", que: "Tu mes vence hoy", sub: "Hasta que esté pagado no puedes entrar al gimnasio.", debe: monto, paga: true };
  const meses = 1 + Math.floor(Math.abs(k) / 30);
  return {
    cls: "atrasado", num: Math.abs(k), que: Math.abs(k) === 1 ? "Día de atraso" : "Días de atraso",
    sub: "Venció el " + largo(a.ven) + (meses > 1 ? ". Son " + plural(meses, "mes", "meses") + "." : "."),
    debe: meses * monto, paga: true, atrasado: true, meses: meses
  };
}

/* ---------- reloj del mes: una raya por día ---------- */

function reloj(a, k) {
  const ven = fecha(a.ven);
  if (!ven || k === null) return "";
  let n, prendidas, hoy, izq, der;
  if (k >= 0) {
    const ini = new Date(ven); ini.setMonth(ini.getMonth() - 1);
    n = Math.max(1, Math.round((ven - ini) / 86400000));
    hoy = Math.max(0, Math.min(n - 1, n - k));
    prendidas = i => i > hoy;
    izq = ini.getDate() + " " + MES3[ini.getMonth()]; der = ven.getDate() + " " + MES3[ven.getMonth()];
  } else {
    n = Math.min(45, Math.abs(k) + 1); hoy = n - 1;
    prendidas = () => true;
    izq = "Venció el " + ven.getDate() + " " + MES3[ven.getMonth()]; der = "hoy";
  }
  const rayas = Array.from({ length: n }, (_, i) => `<i class="${i === hoy ? "hoy" : prendidas(i) ? "on" : ""}" style="--i:${i}"></i>`).join("");
  return `<div class="reloj" aria-hidden="true"><div class="rayas">${rayas}</div><div class="marcas"><span>${esc(izq)}</span><span>${esc(der)}</span></div></div>`;
}

function contar(el) {
  const fin = Number(el.textContent);
  if (!(fin > 1) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 550;
  const paso = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(fin * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(paso); };
  el.textContent = "0"; requestAnimationFrame(paso);
}

/* ---------- pintar ---------- */

const ICONO_WA = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.2-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>`;

function pintar(d) {
  const a = d.alumno;
  const e = leer(d);
  const nombre = String(a.n || "").trim().split(/\s+/)[0] || "";
  const gym = d.gym || "Tu gimnasio";
  const t = d.transferencia || {};
  const hayTransfer = !!(t.cuenta || t.rut);
  const waGym = telNormal(d.wa);
  const plan = PLANES[a.plan] || a.planNombre || "Mensualidad";
  document.title = "Mi cuota · " + gym;

  const msgComprobante = "Hola, soy " + (a.n || nombre) + ". Te mando el comprobante de " + plata(e.debe) + " de mi mensualidad.";
  const msgHablar = "Hola profe, soy " + (a.n || nombre) + ". Quería hablar de mi mensualidad.";
  const linkWa = m => waGym ? "https://wa.me/" + waGym + "?text=" + encodeURIComponent(m) : "";

  const datos = [
    ["Nombre", t.nombre], ["RUT", t.rut], ["Banco", t.banco], ["Tipo de cuenta", t.tipo],
    ["Número de cuenta", t.cuenta], ["Correo", t.correo], ["Monto", e.debe ? plata(e.debe) : ""]
  ].filter(x => x[1]);
  const todoJunto = datos.map(x => x[0] + ": " + x[1]).join("\n");

  const fv = fecha(a.ven);
  const pagar = !e.paga ? `
    <section class="tranquilo">
      <div class="fecha-pelea" aria-hidden="true"><span>${fv ? MES3[fv.getMonth()] : ""}</span><b>${fv ? fv.getDate() : ""}</b><small>${fv ? DIAS_LARGO[fv.getDay()].slice(0, 3) : ""}</small></div>
      <div><div class="t">Próximo pago ${plata(e.proximo)}</div>
      <p>El ${esc(largo(a.ven))}. Te avisamos por WhatsApp unos días antes, a ti nomás.</p></div>
    </section>` : `
    <section class="pagar" aria-label="Pagar">
      ${!a.link ? `<div class="debe"><span class="k">${e.atrasado ? "Tienes pendiente" : "Te toca pagar"}</span><span class="v">${plata(e.debe)}</span></div>` : ""}
      ${a.link ? `<a class="golpe" id="pagoPrincipal" href="${esc(a.link)}" rel="noopener"><span>Pagar con Mercado Pago</span><span class="monto">${plata(e.debe)}</span></a>` : ""}
      ${hayTransfer ? `<button class="golpe ${a.link ? "claro" : ""}" id="verTransfer" ${a.link ? "" : `data-principal="1"`} aria-expanded="false" aria-controls="ticket"><span>Transferir</span><span class="flecha" aria-hidden="true">›</span></button>
      <div class="plegable" id="ticket"><div class="ticket">
        ${datos.map((x, i) => `<div class="fila${x[0] === "Monto" ? " monto" : ""}"><div><div class="k">${esc(x[0])}<span class="ok">✓ copiado</span></div><div class="v">${esc(x[1])}</div></div><button class="copiar" data-i="${i}" aria-label="Copiar ${esc(x[0])}">Copiar</button></div>`).join("")}
        <div class="corte" aria-hidden="true"><span></span></div>
        <div class="abajo">
          <button class="textlink" id="copiarTodo">Copiar todo junto</button>
          ${waGym ? `<p>Cuando transfieras, mándale la foto del comprobante al profe:</p>
          <a class="linkwa" href="${esc(linkWa(msgComprobante))}" rel="noopener">${ICONO_WA}Mandar comprobante</a>` : ""}
        </div>
      </div></div>` : ""}
      ${!a.link && !hayTransfer ? `<p class="efectivo">Se lo puedes pasar en efectivo al profe en tu próxima clase.</p>` : ""}
      ${e.atrasado ? `<p class="salida">¿Estás complicado este mes? ${waGym ? `<a href="${esc(linkWa(msgHablar))}" rel="noopener">Escríbele al profe</a>` : "Háblalo con el profe"} y lo conversan, sin drama.</p>` : ""}
    </section>`;

  const misDias = Array.isArray(a.dias) ? a.dias : String(a.dias || "").split(/\s+/).filter(Boolean);
  const pagos = (Array.isArray(d.pagos) ? d.pagos : []).slice().sort((x, y) => String(y.f).localeCompare(String(x.f))).slice(0, 4);
  const via = v => v === "efectivo" ? "En efectivo" : v === "transferencia" ? "Transferencia" : v === "canje" ? "Canje" : "Mercado Pago";

  document.getElementById("app").innerHTML = `
    <header class="afiche ${e.cls}">
      <div class="cuerdas" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="gym">${esc(gym)}</p>
      <h1 class="nombre">${esc(nombre || "Hola")}</h1>
      <div class="conteo">
        <span class="num${e.num === "✓" ? " check" : ""}">${esc(e.num)}</span>
        <span class="que">${esc(e.que)}<small>${esc(e.sub)}</small></span>
      </div>
      ${reloj(a, diasHasta(a.ven))}
    </header>

    ${pagar}

    <section class="carnet" aria-label="Tu carnet">
      <div class="cinta"><span>Carnet de socio</span><span>${esc(gym)}</span></div>
      <div class="cuerpo">
        ${!e.paga && fv ? `<div class="estampa">Pagado<small>hasta ${fv.getDate()} ${MES3[fv.getMonth()]}</small></div>` : ""}
        <div class="plan">${esc(plan)}</div>
        <div class="precio">${plata(a.mensual || a.m)} al mes · corte el ${fecha(a.ven) ? fecha(a.ven).getDate() : 10}</div>
        ${misDias.length ? `<div class="hoyos" aria-label="Tus días: ${esc(y(misDias.map(id => (SEMANA.find(s => s[0] === id) || [,, id])[2])))}">${SEMANA.map(([id, l]) =>
          `<div class="hoyo ${misDias.indexOf(id) >= 0 ? "suyo" : ""}"><i></i>${l}</div>`).join("")}</div>
        <p class="nota">Te tocan los ${esc(y(misDias.map(id => (SEMANA.find(s => s[0] === id) || [,, id])[2])))}.</p>` : ""}
      </div>
    </section>

    <section class="pagos">
      <h2>Tus pagos</h2>
      ${pagos.length ? `<ol>${pagos.map(p => { const f = fecha(p.f); return `<li>
        <div class="sello">${f ? `<b>${f.getDate()}</b><span>${MES3[f.getMonth()]}</span>` : "—"}</div>
        <div class="c">${esc(via(p.via))}${p.hasta ? `<br>cubre hasta el ${esc(corto(p.hasta))}` : ""}</div>
        <div class="m">${plata(p.m)}</div></li>`; }).join("")}</ol>`
        : `<p class="vacio">Todavía no hay pagos anotados.</p>`}
    </section>

    ${MODO_DEMO ? `<div class="demo"><p>Esto es un ejemplo. Mira cómo lo ve un alumno:</p><div role="group" aria-label="Estado de ejemplo">
      ${[["aldia","Al día"],["vence","5 días"],["manana","Mañana"],["atrasado","Atrasado"]].map(([k, t]) => `<button data-caso="${k}" aria-pressed="${k === (d.caso || "vence")}">${t}</button>`).join("")}</div></div>` : ""}

    <p class="pie">Este link es solo tuyo, no lo compartas.${waGym ? ` ¿Algo no cuadra? <a href="${esc(linkWa(msgHablar))}">Escríbele al profe</a>.` : ""}</p>

    ${e.paga && (a.link || hayTransfer) ? `<div class="barra" id="barra" aria-hidden="true">
      <div class="cuanto">${plata(e.debe)}<small>${e.atrasado ? "pendiente" : "te toca"}</small></div>
      <button class="golpe" id="barraPagar" tabindex="-1">${a.link ? "Pagar" : "Transferir"}</button></div>` : ""}`;

  const num = document.querySelector(".conteo .num");
  if (num) contar(num);
  document.querySelectorAll(".demo button").forEach(b => b.onclick = () => { pintar(ejemplo(b.dataset.caso)); scrollTo({ top: 0 }); });
  document.querySelectorAll(".golpe").forEach(b => b.addEventListener("pointerdown", () => navigator.vibrate && navigator.vibrate(12)));

  const ver = document.getElementById("verTransfer");
  if (ver) ver.onclick = () => {
    const caja = document.getElementById("ticket");
    const abre = !caja.classList.contains("abierto");
    caja.classList.toggle("abierto", abre);
    ver.setAttribute("aria-expanded", String(abre));
    if (abre) setTimeout(() => caja.scrollIntoView({ behavior: "smooth", block: "nearest" }), 280);
  };

  // La barra de abajo aparece solo cuando el botón principal ya se fue hacia arriba.
  const barra = document.getElementById("barra");
  const principal = document.getElementById("pagoPrincipal") || document.querySelector("[data-principal]");
  if (barra && principal && "IntersectionObserver" in window) {
    new IntersectionObserver(([x]) => {
      const ver = !x.isIntersecting && x.boundingClientRect.top < 0;
      barra.classList.toggle("ver", ver); barra.setAttribute("aria-hidden", String(!ver));
      document.getElementById("barraPagar").tabIndex = ver ? 0 : -1;
    }).observe(principal);
    document.getElementById("barraPagar").onclick = () => {
      if (a.link) { location.href = a.link; return; }
      scrollTo({ top: 0, behavior: "smooth" });
      if (!document.getElementById("ticket").classList.contains("abierto")) principal.click();
    };
  }
  document.querySelectorAll(".copiar").forEach(b => {
    b.onclick = () => {
      const x = datos[Number(b.dataset.i)];
      // El monto y la cuenta se pegan en el banco sin puntos ni signo.
      const crudo = x[0] === "Monto" ? String(Math.round(e.debe)) : x[0] === "Número de cuenta" ? String(x[1]).replace(/\D/g, "") || x[1] : x[1];
      copiar(crudo, b);
      b.closest(".fila").classList.add("copiado");
    };
  });
  const todo = document.getElementById("copiarTodo");
  if (todo) todo.onclick = () => copiar(todoJunto, null);
}

function falla(titulo, texto) {
  document.getElementById("app").innerHTML = `<header class="afiche atrasado" style="padding-bottom:0"><div class="cuerdas" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="falla"><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>`;
}

/* ---------- datos ---------- */

let MODO_DEMO = false;

function ejemplo(caso) {
  caso = caso || "vence";
  const ven = new Date(HOY); ven.setDate(ven.getDate() + ({ aldia: 18, vence: 5, manana: 1, atrasado: -6 }[caso]));
  const iso = x => x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
  const atras = n => { const x = new Date(ven); x.setMonth(x.getMonth() - n); return iso(x); };
  return {
    caso, gym: "Gimnasio de Boxeo", wa: "56900000000",
    transferencia: { nombre: "Gimnasio de Boxeo SpA", rut: "77.123.456-7", banco: "BancoEstado", tipo: "Cuenta RUT", cuenta: "12345678", correo: "pagos@gimnasio.cl" },
    alumno: { n: "Diego Cárcamo", ven: iso(ven), m: 40000, mensual: 40000, plan: "p3", dias: ["lun","mie","vie"], link: "https://mpago.la/ejemplo" },
    pagos: [{ f: atras(1), m: 40000, via: "transferencia", hasta: iso(ven) }, { f: atras(2), m: 40000, via: "efectivo", hasta: atras(1) }]
  };
}

function desdeHash() {
  const m = /[#&]d=([^&]+)/.exec(location.hash);
  if (!m) return null;
  try {
    const b = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b + "===".slice((b.length + 3) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}

(function iniciar() {
  const q = new URLSearchParams(location.search);
  const id = q.get("a"), k = q.get("k");
  if (id && k) {
    fetch("/api/cuota?a=" + encodeURIComponent(id) + "&k=" + encodeURIComponent(k), { cache: "no-store" })
      .then(r => {
        if (r.status === 404 || r.status === 403) throw new Error("link");
        if (!r.ok) throw new Error("red");
        return r.json();
      })
      .then(pintar)
      .catch(e => e.message === "link"
        ? falla("Este link no funciona", "Puede que esté incompleto. Pídele al profe que te lo mande de nuevo.")
        : falla("No pudimos cargar tu cuota", "Revisa tu conexión e inténtalo en un rato."));
    return;
  }
  const h = desdeHash();
  if (!h) MODO_DEMO = true;
  pintar(h || ejemplo());
})();
</script>
